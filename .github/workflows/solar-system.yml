name: Solar System Workflow

on:
  workflow_dispatch:
  push:


env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
  unit-testing:
    name: Unit Testing

    strategy:
      matrix:
        nodejs_version: [18, 19]
        operating_system: [ubuntu-latest]
    runs-on: ${{ matrix.operating_system }}
    services:
      mongodb:
        image: siddharth67/mongo-db:non-prod
        ports:
          - 27017:27017
    env:
     MONGO_URI: 'mongodb://localhost:27017/superData'
     MONGO_USERNAME: non-prod-user
     MONGO_PASSWORD: non-prod-password
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NodeJS Version - ${{ matrix.nodejs_version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.nodejs_version }}

      - name: Install Dependencies
        run: npm install

      - name: Unit Testing
        run: npm test

      - name: Archive Test Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mocha-Test-Result-${{ matrix.operating_system }}-node-${{ matrix.nodejs_version }}
          path: test-results.xml

  code-coverage:
    name: Code Coverage
    container: 
      image: node:18
    services:
      mongodb:
        image: siddharth67/mongo-db:non-prod
        options: 
          --name mongo
    env:
     MONGO_URI: 'mongodb://mongo:27017/superData'
     MONGO_USERNAME: non-prod-user
     MONGO_PASSWORD: non-prod-password
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # - name: Setup NodeJS Version - 18
      #   uses: actions/setup-node@v3
      #   with:
      #     node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Check Code Coverage
        continue-on-error: true
        run: npm run coverage

      - name: Archive Test Result
        uses: actions/upload-artifact@v4
        with:
          name: Code-Coverage-Result
          path: coverage
          retention-days: 5
  docker:
    name: Containerization
    needs: [unit-testing, code-coverage]
    permissions: 
        packages: write
        
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Dockerhub Login
        uses: docker/login-action@v2.2.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: docker build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
           
      - name: GHCR Login
        uses: docker/login-action@v2.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Image Testing
        run: |
         docker images
         docker run --name solar-system-app -d \
         -p 3000:3000 \
         -e MONGO_URI=$MONGO_URI \
         -e MONGO_USERNAME=$MONGO_USERNAME \
         -e MONGO_PASSWORD=$MONGO_PASSWORD \
         ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

          export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
          echo $IP
          echo Testing Image URL using wget
          wget -q -O - 127.0.0.1:3000/live | grep live

      - name: Container Registry Push to docker hub
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
            
            ghcr.io/${{ github.repository }}/solar-system:${{ github.sha }}

      - name: Container Registry Push github package 
        uses: docker/build-push-action@v4
        with: 
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/solar-system:${{ github.sha }}

  dev-deploy:
    needs: 
        - docker
    environment: 
      name: development
      url: https://${{steps.set-ingress-host-address.outputs.APP_INGRESS_HOST}}
    runs-on: ubuntu-latest
    outputs:
      APP_INGRESS_URL: ${{steps.set-ingress-host-address.outputs.APP_INGRESS_HOST}} 
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Kubectl CLI
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.33.6'

      - name: Set Context of Kubconfig
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{secrets.KUBECONFIG}}
          
      - name: Fetch kuberenetes Cluster Detalis
        run: |
          kubectl version -o yaml
          echo ------------------------------------
          kubectl get nodes
      - name: Get IP Address Ingress controller Using GitHub ENV 
        run: |
          echo "INGRESS_IP=$(kubectl -n ingress-nginx get svc ingress-nginx-controller -o jsonpath="{.status.loadBalancer.ingress[0].ip}")" >> $GITHUB_ENV

      - name: Replace Tokens
        uses: cschleiden/replace-tokens@v1
        with:
          tokenPrefix: '${'
          tokenSuffix: '}'
          files: '["kubernetes/development/*.yaml"]'
        env:
          NAMESPACE: ${{vars.NAMESPACE}}
          REPLICAS: ${{vars.REPLICAS}}
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
          INGRESS_IP: ${{env.INGRESS_IP}}

      - name: Check File
        run: |
          cat kubernetes/development/*.yaml

      - name: Create MongoDB scret
        run: |
          kubectl create namespace ${{ vars.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          
          kubectl -n ${{ vars.NAMESPACE }} create secret generic mongo-db-creds \
          --from-literal=MONGO_URI='${{ env.MONGO_URI }}' \
          --from-literal=MONGO_USERNAME='${{ vars.MONGO_USERNAME }}' \
          --from-literal=MONGO_PASSWORD='${{ secrets.MONGO_PASSWORD }}' \
          --save-config --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy to Dev env
        run: |
          kubectl apply -f kubernetes/development

      - name: Set App Ingress Host URL
        id: set-ingress-host-address
        run: |
          echo "APP_INGRESS_HOST=$(kubectl -n developer get ingress -o jsonpath='{.items[0].spec.tls[0].hosts[0]}')" >> "$GITHUB_OUTPUT"


  integration-testing:
    name: Dev Intergration Testing
    needs: dev-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Test URL Output using CURL and JQ
        env:
          URL: ${{needs.dev-deploy.outputs.APP_INGRESS_URL}}
        run: |
          echo $URL
          echo "------------------------------------"
          curl https://$URL/live -s -k | jq -r .status | grep -i live
        


        
          
        